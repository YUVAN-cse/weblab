<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
    </head>
    <style>
        body{
            display: flex;
            justify-content:center;
            align-items: center;
        }
        .main{
            border: 2px solid black;
            height: 500px;
            width: 350px;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            /* justify-content:center; */
            align-items: center;
        }
        .title{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 20px;
            color: black;
            height: 15%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .display{
            border: 1px solid black;
            height: 10%;
            width: 80%;
            border-radius: 10px;
            margin-top: 5%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .key{
            height: 15%;
            width: 15%;
            border: 1px solid black;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
            margin-left: 15px;
        }
        .keys{
            width: 85%;
            height: 60%;
            margin-top: 5%;
            padding: 12px;
            display: flex;
            flex-wrap: wrap;    
        }
        body{
        	height: 100vh;
        	width: 100vw;
        }
    </style>

    <body>   
        <div class="main">
            <div class="title">CALCULATOR</div>
            <div class="display"></div>
            <div class="keys">
                <div class="key-1 key" id="1">1</div>
                <div class="key-2 key" id="2">2</div>
                <div class="key-3 key" id="3">3</div>
                <div class="key-4 key" id="4">4</div>
                <div class="key-5 key" id="5">5</div>
                <div class="key-6 key" id="6">6</div>
                <div class="key-7 key" id="7">7</div>
                <div class="key-8 key" id="8">8</div>
                <div class="key-9 key" id="9">9</div>
                <div class="key-0 key" id="0">0</div>
                <div class="key">+</div>
                <div class="key">-</div>
                <div class="key">*</div>
                <div class="key">/</div>
                <div class="key">AC</div>
                <div class="key">C</div>
                <div class="key">/</div>
                <div class="key-enter key" id="e">enter</div>
            </div>
        </div>
    </body>
     <script>
        let d = document.querySelector(".display")
        let keys = document.getElementsByClassName("key")
        for(let i=0;i<keys.length;i++){
            // console.log(keys[i].innerHTML)
            keys[i].addEventListener("click",(e)=>{
                        if(e.target.innerHTML == "enter"){
                            try{
                        let local = eval(d.innerHTML);

                    if (
                        local === undefined ||
                        local === null ||
                        !Number.isFinite(local)
                    ) {
                        local = "";
                    }
                    d.innerHTML = local;
                }catch(e){
                    d.innerHTML=""
                }
    
                    }else if(e.target.innerHTML == "AC"){
                        d.innerHTML = ""
                    }else if(e.target.innerHTML == "C"){
                        let ref = d.innerHTML
                        if(ref.length != 0){
                            d.innerHTML = ref.substring(0,ref.length-1)
                        }
                    }else{
                        d.innerHTML += e.target.innerHTML
                    }
            })
        }
    </script>
   
</html>
